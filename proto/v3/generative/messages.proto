syntax = "proto3";

package ai.sigmafinancial.aima.v3.generative.services;

// A request for workflow metadata
message ViewWorkflowRequest {
    // The workflow to view, or empty for every workflow on the account
    string workflow_id = 1;
}

// Workflow metadata
message ViewWorkflowResponse {
    // The workflows, keyed by workflow id
    map<string, Workflow> workflows = 1;
}

// The metadata of a workflow
message Workflow {
    // The workflow id
    string id = 1;
    // The workflow's human-readable name
    string name = 2;
    // The workflow's input parameters
    repeated FieldSchema parameters = 3;
    // The shape of the workflow's response content
    ObjectSchema response = 4;
    // A human-readable description of the workflow
    string description = 5;
    // The path to the field that carries the workflow's primary content, unstable
    repeated FieldAccessor internal_primary_field = 6;
}

// A step in a path to a field
message FieldAccessor {
    oneof accessor {
        // The field name to step into
        string field_name = 1;
        // The array index to step into
        int32 field_index = 2;
    }
}

// A request to run a workflow
message InvokeWorkflowRequest {
    // The workflow to run
    string workflow_id = 1;
    // The parameter values to run it with
    ObjectValue parameters = 2;
}

// A primitive leaf type
enum ScalarType {
    SCALAR_TYPE_UNSPECIFIED = 0;
    SCALAR_TYPE_STRING      = 1;
    SCALAR_TYPE_INT         = 2;
    SCALAR_TYPE_DOUBLE      = 3;
    SCALAR_TYPE_BOOL        = 4;
}

// The shape of a value
message TypeSpec {
    oneof kind {
        // A primitive value
        ScalarType   scalar = 1;
        // An object with named fields
        ObjectSchema object = 2;
        // A list of elements
        ArraySchema  array  = 3;
    }
}

// A named member of an object, or a workflow input parameter
message FieldSchema {
    // The field name
    string name = 1;
    // The field's type
    TypeSpec type = 2;
    // Whether the field is required
    bool required = 3;
    // The value used when none is supplied
    FieldValue default_value = 4;
    // An example value
    FieldValue example_value = 5;
    // The values the field may take
    repeated FieldValue allowed_values = 6;
    // A human-readable description of the field
    string description = 7;
}

// The members of an object
message ObjectSchema {
    // The object's fields
    repeated FieldSchema fields = 1;
}

// A list of unnamed elements of one type
message ArraySchema {
    // The type of each element
    TypeSpec element = 1;
}

// A typed value
message FieldValue {
    oneof value {
        // A string value
        string      string_value = 1;
        // An integer value
        int64       int_value    = 2;
        // A floating-point value
        double      double_value = 3;
        // A boolean value
        bool        bool_value   = 4;
        // An object value
        ObjectValue object_value = 5;
        // A list value
        ArrayValue  array_value  = 6;
    }
}

// An object's values
message ObjectValue {
    // The values, keyed by field name
    map<string, FieldValue> fields = 1;
}

// A list of values
message ArrayValue {
    // The values in the list
    repeated FieldValue values = 1;
}

// The result of a workflow run
message InvokeWorkflowResponse {
    // The workflow-specific report content
    ObjectValue    content  = 1;
    // Metadata about the report
    ReportMetadata metadata = 2;
}

// Metadata about a generated report
message ReportMetadata {
    // The report id
    string report_id    = 1;
    // The node that generated the report
    string node_id      = 2;
    // When the report was generated, in Unix epoch nanoseconds
    int64  generated_at = 3;
    // What generated the report
    string generated_by = 4;
}
