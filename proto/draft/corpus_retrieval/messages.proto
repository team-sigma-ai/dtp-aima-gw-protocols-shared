syntax = "proto3";

package ai.sigmafinancial.aima.draft.corpus_retrieval.services;

// One conversation turn
message Message {
    // Who wrote the message
    string role = 1;
    // The message text
    string content = 2;
}

// One cited source document
message Source {
    // The source's key within the turn
    int32  source_id = 1;
    // The source vendor's version-qualified document id
    string vendor_document_id = 2;
    // The document's relative path within the corpus
    string rel_path = 3;
    // The excerpt that supports the citing claims
    string quote = 4;
    // Where the quote sits in the source document
    SourceSpan span = 5;
}

// The offsets of a cited excerpt within the source document as supplied
message SourceSpan {
    // The start offset, in bytes
    int32 start_byte = 1;
    // The end offset, in bytes
    int32 end_byte = 2;
    // The start offset, in UTF-16 code units
    int32 start_utf16 = 3;
    // The end offset, in UTF-16 code units
    int32 end_utf16 = 4;
}

// The per-claim attribution verdicts for an answer
message Attribution {
    // The attribution backend that produced the verdicts
    string backend_id = 1;
    // The answer text the spans index into
    string answer = 2;
    // Whether the claims were scored
    bool   scored = 3;
    // The claims extracted from the answer
    repeated Claim claims = 4;
    // The source text quoted verbatim in the answer
    repeated VerbatimSpan verbatims = 5;
}

// One atomic claim extracted from the answer
message Claim {
    // The claim text
    string text = 1;
    // Where the claim sits in the answer
    ClaimSpan span = 2;
    // The sources the claim cites
    repeated int32 source_ids = 3;
    // The source that supports the claim
    int32 support_source_id = 4;
    // The claim's attribution verdict
    AttributionResult attribution = 5;
    // The raw scoring outputs behind the verdict
    repeated RawAttributionResult raw_attribution = 6;
}

// The offsets of a claim's text within the answer
message ClaimSpan {
    // The start offset, in UTF-16 code units
    int32 start_utf16 = 1;
    // The end offset, in UTF-16 code units
    int32 end_utf16 = 2;
}

// The evaluation verdict for one claim
message AttributionResult {
    // How well the evidence supports the claim
    AttributionLabel label = 1;
    // The confidence in the label
    float confidence = 2;

    // How well the evidence supports a claim
    enum AttributionLabel {
        ATTRIBUTION_LABEL_UNSPECIFIED = 0;
        ATTRIBUTION_LABEL_SUPPORTED_BY_CITED = 1;
        ATTRIBUTION_LABEL_SUPPORTED_BY_OTHER = 2;
        ATTRIBUTION_LABEL_UNSUPPORTED = 3;
        ATTRIBUTION_LABEL_CONTRADICTED = 4;
    }
}

// One raw scoring output behind a claim's attribution verdict
message RawAttributionResult {
    // The output's label
    string text = 1;

    oneof value {
        // A 32-bit integer value
        int32 int32_value = 2;
        // A 64-bit integer value
        int64 int64_value = 3;
        // A floating-point value
        double double_value = 4;
        // A string value
        string string_value = 5;
    }
}

// Source text quoted verbatim in the answer
message VerbatimSpan {
    // The verbatim tag number
    int32 verbatim = 1;
    // Where the quoted text sits in the answer
    ClaimSpan span = 2;
    // The source the text is quoted from
    int32 source_id = 3;
    // The state of the quotation
    VerbatimState state = 4;

    // The state of a verbatim quotation
    enum VerbatimState {
        VERBATIM_STATE_UNSPECIFIED = 0;
        VERBATIM_STATE_QUOTED_UNSCORED = 1;
    }
}

// The agent's current plan
message PlanUpdate {
    // Why the plan takes this shape
    string rationale = 1;
    // The plan's items, in order
    repeated PlanItem items = 2;
}

// One item in the plan
message PlanItem {
    // The item id
    uint32 id = 1;
    // The item text
    string text = 2;
    // The item's progress
    PlanItemStatus status = 3;

    // The progress of a plan item
    enum PlanItemStatus {
        PLAN_ITEM_STATUS_UNSPECIFIED = 0;
        PLAN_ITEM_STATUS_PENDING = 1;
        PLAN_ITEM_STATUS_RUNNING = 2;
        PLAN_ITEM_STATUS_DONE = 3;
        PLAN_ITEM_STATUS_FAILED = 4;
        PLAN_ITEM_STATUS_SKIPPED = 5;
    }
}

// A step transition in the retrieval timeline
message StepEvent {
    // The step id
    uint32 step_id = 1;
    // The step's operation
    string op = 2;
    // The step's progress
    PlanItem.PlanItemStatus status = 3;
    // A short summary of what the step produced
    string summary = 4;
}

// A tool invocation made during retrieval
message ToolCall {
    // The tool name
    string name = 1;
    // The call's arguments, as JSON
    string args_json = 2;
}

// The result of a tool invocation
message ToolResult {
    // The tool name
    string name = 1;
    // The call's result, as JSON
    string result_json = 2;
}

// Incremental reasoning text
message ReasoningDelta {
    // The next piece of reasoning text
    string content = 1;
}

// Incremental answer text
message TextDelta {
    // The next piece of answer text
    string content = 1;
}

// A request to compact a conversation history
message CompactHistoryRequest {
    // The conversation to compact
    repeated Message messages = 1;
    // The number of most recent messages to keep as they are
    int32 keep_recent_messages = 2;
}

// A compacted conversation history
message CompactHistoryResult {
    // The compacted conversation
    repeated Message messages = 1;
    // The index of the first request message folded into the summary
    int32 compacted_from = 2;
    // The index after the last request message folded into the summary
    int32 compacted_to = 3;
    // The token count of the request's messages
    int32 original_tokens = 4;
    // The token count of the compacted messages
    int32 resulting_tokens = 5;
}

// A request to run a turn over the conversation so far
message CreateTurnRequest {
    // The conversation so far
    repeated Message messages = 1;
    // Free-text context from the client
    string additional_instructions = 2;
    // The key that identifies the turn for retries and re-attach
    string idempotency_key = 3;
    // The context id issued to the integrating client
    string context_id = 4;
}

// One streamed turn event
message TurnEvent {
    oneof event {
        // The turn was scheduled or re-attached
        TurnAck ack = 1;
        // A progress frame
        TurnFrame frame = 2;
        // The turn's successful result
        TurnResult result = 3;
        // The turn's failure
        TurnError error = 4;
    }
}

// The acknowledgement that a turn was scheduled or re-attached
message TurnAck {
    // The idempotency key from the request
    string idempotency_key = 1;
    // The turn id
    string turn_id = 2;
    // Whether this call re-attached to an existing turn
    bool attached = 3;
}

// One progress frame
message TurnFrame {
    // The frame's position in the turn's event sequence
    int64 event_id = 1;

    oneof frame {
        // A lifecycle change
        TurnStatus status = 2;
        // A plan update
        PlanUpdate plan = 3;
        // A step transition
        StepEvent step = 4;
        // A tool invocation
        ToolCall tool_call = 5;
        // A tool result
        ToolResult tool_result = 6;
        // Incremental reasoning text
        ReasoningDelta reasoning = 7;
        // Incremental answer text
        TextDelta answer = 8;
    }
}

// Where the turn is in its lifecycle
message TurnStatus {
    // The lifecycle state of a turn
    enum State {
        STATE_UNSPECIFIED = 0;
        STATE_SCHEDULED = 1;
        STATE_RUNNING = 2;
        STATE_RESUMED = 3;
        STATE_ATTRIBUTING = 4;
    }

    // The turn's lifecycle state
    State state = 1;
}

// The successful result of a turn
message TurnResult {
    // The answer text
    string content = 1;
    // The sources the answer cites
    repeated Source sources = 2;
    // The answer's attribution verdicts
    Attribution attribution = 3;
    // The corpus generation the turn was served from
    string corpus_generation = 4;
    // The turn whose answer this result reuses
    string served_from = 5;
    // How the turn ended
    TurnOutcome outcome = 6;
}

// How the turn ended
message TurnOutcome {
    // The turn answered the question from the corpus
    message Answered {}

    // The turn did not answer
    message Declined {
        // Why the turn did not answer
        string reason = 1;
    }

    // The turn gave up before answering
    message Bailed {
        // Why the turn gave up
        string reason = 1;
    }

    oneof outcome {
        // The turn answered
        Answered answered = 1;
        // The turn declined to answer
        Declined declined = 2;
        // The turn gave up
        Bailed bailed = 3;
    }
}

// A turn failure reported mid-stream
message TurnError {
    // A description of the failure, for display
    string message = 1;

    // A retrieval or generation error
    message RunFailed {}

    // The messages exceed the context budget
    message ContextExceeded {
        // The token count of the supplied messages
        int32 current_tokens = 1;
        // The token budget for the messages
        int32 limit_tokens = 2;
    }

    // The server could not tell whether the messages fit the context budget
    message TokenCountUnavailable {}

    oneof error {
        // The run failed
        RunFailed run_failed = 2;
        // The messages exceed the context budget
        ContextExceeded context_exceeded = 3;
        // The token count could not be determined
        TokenCountUnavailable token_count_unavailable = 4;
    }
}
