syntax = "proto3";

package ai.sigmafinancial.aima.draft.corpus_retrieval.services;

// One conversation turn.
message Message {
    string role = 1;     // "user" | "assistant" | "summary"
    string content = 2;
}

// One cited source document.
message Source {
    int32  source_id = 1;          // stable integer key, 1-based; referenced by Claim.source_ids

    // The source vendor's native, version-qualified document identifier. Opaque,
    // so it stays agnostic to the vendor — it already pins the exact version
    // retrieved; consumers parse any date / qualifier out of it themselves.
    // Typically a document slug joined with its version date, e.g.
    // "esma70-156-4572-...-pdf/2021-09-29" (the "/" separator is provisional).
    string vendor_document_id = 2;

    string rel_path = 3;           // relative path within the corpus
    string quote = 4;              // verbatim excerpt supporting the claim(s)

    // Gateway-verified that `quote` occurs in the cited source version. The
    // gateway resolves the corpus file from rel_path internally; consumers
    // deep-link through the corpus API using rel_path.
    bool   quote_verified = 5;
}

// The trailing attribution event. Carries the per-claim NLI verdicts computed
// out of band after the answer is known.
message Attribution {
    string backend_id = 1;
    string answer = 2;             // DISPLAY answer (backend-A [n] markers stripped); spans index into THIS
    bool   scored = 3;             // false => every claim.attribution.label = UNSPECIFIED
    repeated Claim claims = 4;
    repeated VerbatimSpan verbatims = 5;  // quoted source text spliced into `answer`; never scored
}

// One atomic claim extracted from the answer.
message Claim {
    string text = 1;
    ClaimSpan span = 2;                 // ABSENT when the claim text could not be located; consumers text-match
    repeated int32 source_ids = 3;      // -> Source.source_id (the sources this claim cites)
    int32 support_source_id = 4;        // -> Source.source_id; 0 means no support source applies
    AttributionResult attribution = 5;
}

// UTF-16 code-unit offsets of a claim's text within Attribution.answer
// (UTF-16 because the JS frontend indexes strings in code units).
message ClaimSpan {
    int32 start_utf16 = 1;
    int32 end_utf16 = 2;
}

// The NLI (or LLM) attribution verdict for one claim.
message AttributionResult {
    AttributionLabel label = 1;
    float confidence = 2;          // 0..1; 0 when unscored

    enum AttributionLabel {
        ATTRIBUTION_LABEL_UNSPECIFIED = 0;        // unscored (NLI unavailable)
        ATTRIBUTION_LABEL_SUPPORTED_BY_CITED = 1; // a cited source entails the claim (audit-grade)
        ATTRIBUTION_LABEL_SUPPORTED_BY_OTHER = 2; // read-but-uncited evidence entails it (NLI only)
        ATTRIBUTION_LABEL_UNSUPPORTED = 3;        // no evidence entails the claim (fabrication risk)
        ATTRIBUTION_LABEL_CONTRADICTED = 4;       // evidence actively contradicts the claim (NLI only)
    }
}

// A `<verbatim>` reference: source text the answer stage spliced directly
// into `Attribution.answer`, addressed by unit range rather than authored as
// a paraphrasing `Claim`. Never scored — a quotation entails itself.
message VerbatimSpan {
    int32 verbatim = 1;             // 1-based, matches the `<verbatim v="…"/>` tag number
    ClaimSpan span = 2;             // UTF-16 offsets of the spliced text within Attribution.answer
    int32 source_id = 3;            // -> Source.source_id; the same pool Claim.source_ids indexes into
    VerbatimState state = 4;

    // Distinct from every AttributionLabel value: a verbatim is not "unscored
    // because NLI was unavailable", it is "not a claim, so there is nothing to
    // score".
    enum VerbatimState {
        VERBATIM_STATE_UNSPECIFIED = 0;
        VERBATIM_STATE_QUOTED_UNSCORED = 1; // quoted source text, unscored by design
    }
}

// The live plan the agent maintains and revises (the update_plan tool / ODA
// plan). Rendered as a Junie-style task list: an ordered list of items, each
// carrying its own status.
message PlanUpdate {
    string rationale = 1;
    repeated PlanItem items = 2;
}

message PlanItem {
    uint32 id = 1;
    string text = 2;
    PlanItemStatus status = 3;

    enum PlanItemStatus {
        PLAN_ITEM_STATUS_UNSPECIFIED = 0;
        PLAN_ITEM_STATUS_PENDING = 1;   // not yet reached (the default at plan emit)
        PLAN_ITEM_STATUS_RUNNING = 2;   // currently executing
        PLAN_ITEM_STATUS_DONE = 3;      // completed successfully
        PLAN_ITEM_STATUS_FAILED = 4;    // attempted but failed
        PLAN_ITEM_STATUS_SKIPPED = 5;   // replaced by a plan revision
    }
}

// A harness-driven step / stage transition in the retrieval timeline.
message StepEvent {
    uint32 step_id = 1;
    string op = 2;                          // "retrieve" | "read" | "assess" | "respond"
    PlanItem.PlanItemStatus status = 3;     // started -> RUNNING; finished -> DONE / FAILED / SKIPPED
    string summary = 4;                     // short human summary of what the step produced
}

// A tool invocation the agent made during retrieval, and (separately) its
// result. args / result are JSON strings — the harness telemetry carries raw
// JSON, so the wire stays schema-stable as tools evolve.
message ToolCall {
    string name = 1;        // e.g. "browse", "grep", "read_candidates", "register_finding"
    string args_json = 2;
}

message ToolResult {
    string name = 1;
    string result_json = 2;
}

// Incremental agent reasoning / "thinking" text, streamed live as the agent
// works. Distinct from `delta`, which is the answer text.
message ReasoningDelta {
    string content = 1;
}

message TextDelta {
    string content = 1;
}

// Request to CompactHistory: the full conversation to compact.
message CompactHistoryRequest {
    repeated Message messages = 1;

    // Most-recent messages to preserve verbatim. 0 -> server default.
    int32 keep_recent_messages = 2;
}

// Result of CompactHistory: a shorter history, directly usable as the
// `messages` of a subsequent CreateTurnRequest.
message CompactHistoryResult {
    repeated Message messages = 1;

    // Half-open [compacted_from, compacted_to) index range into the request's
    // `messages` that was folded into a summary turn.
    int32 compacted_from = 2;
    int32 compacted_to = 3;

    int32 original_tokens = 4;
    int32 resulting_tokens = 5;
}

message CreateTurnRequest {
    // The conversation so far. The client supplies the full history on every
    // call.
    repeated Message messages = 1;

    // A single opaque free-text context string composed by the client. At
    // most 4,096 bytes; a larger request is rejected. Untrusted.
    string additional_instructions = 2;

    // Scopes idempotency and re-attach. Required; empty is rejected.
    string idempotency_key = 3;

    // Provided by Sigma to the integrating client. Required; empty is
    // rejected.
    string context_id = 4;
}

// One streamed turn event; exactly one payload is set.
//
// Sequence: `ack`, then zero or more `frame`s in `event_id` order, then
// exactly one `result` or `error`, then close. `ack` is always first.
message TurnEvent {
    oneof event {
        TurnAck ack = 1;       // immediate: request valid, turn scheduled or attached
        TurnFrame frame = 2;   // progress, replayed or live
        TurnResult result = 3; // terminal success
        TurnError error = 4;   // terminal failure
    }
}

// The immediate ack.
message TurnAck {
    string idempotency_key = 1;

    // Server-assigned turn identifier. Stable for a given idempotency key.
    string turn_id = 2;

    // False: this call scheduled a new turn. True: the key matched an existing
    // turn and this call re-attached to it.
    bool attached = 3;
}

// One progress frame. Replayed and live frames take the same form.
// `event_id` orders frames and is stable across replays.
message TurnFrame {
    int64 event_id = 1;

    oneof frame {
        TurnStatus status = 2;
        PlanUpdate plan = 3;
        StepEvent step = 4;
        ToolCall tool_call = 5;
        ToolResult tool_result = 6;
        ReasoningDelta reasoning = 7;
        TextDelta answer = 8;
    }
}

// Where the turn is in its lifecycle.
message TurnStatus {
    enum State {
        STATE_UNSPECIFIED = 0;
        STATE_SCHEDULED = 1;    // admitted, not yet started
        STATE_RUNNING = 2;      // the turn is executing
        STATE_RESUMED = 3;      // execution resumed after an interruption
        STATE_ATTRIBUTING = 4;  // the answer is written, attribution is scoring it
    }

    State state = 1;
}

// Terminal success.
message TurnResult {
    string content = 1;
    repeated Source sources = 2;

    // Absent when attribution was not computed, or when it failed. The answer
    // is never retracted on that path, only unscored.
    Attribution attribution = 3;

    // The corpus generation this turn was served from.
    string corpus_generation = 4;

    // Set when this result reuses an earlier turn's answer: the `turn_id` of
    // the turn that computed the content. Empty when this turn computed its
    // own.
    string served_from = 5;

    TurnOutcome outcome = 6;
}

// How the turn ended. Exactly one variant is set.
message TurnOutcome {
    // The turn answered the question from the corpus.
    message Answered {}

    // The turn did not answer. Covers a refusal and an empty corpus search
    // alike; `reason` says which.
    message Declined {
        string reason = 1;
    }

    // The turn gave up before answering, for example on a deadline.
    message Bailed {
        string reason = 1;
    }

    oneof outcome {
        Answered answered = 1;
        Declined declined = 2;
        Bailed bailed = 3;
    }
}

// Terminal failure. Exactly one variant is set. These are the failures that
// reach a client mid-stream; a request rejected before its turn is admitted
// fails the call with a gRPC status and produces no events.
message TurnError {
    // Self-contained: states the problem and, where there is one, the remedy.
    // For display, not for branching on.
    string message = 1;

    // Retrieval or generation error. Safe to retry.
    message RunFailed {}

    // The supplied messages exceed the context budget. Call CompactHistory,
    // then retry.
    message ContextExceeded {
        int32 current_tokens = 1;
        int32 limit_tokens = 2;
    }

    // The server could not determine whether the messages fit the budget.
    message TokenCountUnavailable {}

    oneof error {
        RunFailed run_failed = 2;
        ContextExceeded context_exceeded = 3;
        TokenCountUnavailable token_count_unavailable = 4;
    }
}
