syntax = "proto3";

package ai.sigmafinancial.aima.v1.auth;

// An app key
message AppKey {
    // The app key id
    string id = 1;
    // The account the key belongs to
    string account_id = 3;
    // The private part of the key pair
    string secret = 5;
    // The public part of the key pair
    string public = 10;
    // When the key pair was issued, in Unix epoch seconds
    int64 created = 15;
    // The scopes the key pair can issue tokens for, deprecated
    repeated int32 scope = 30;
}
