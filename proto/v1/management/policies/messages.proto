syntax = "proto3";

package ai.sigmafinancial.aima.v1.management.policy.services;

// A single permission statement
message Statement {
    // The statement id
    string id = 1;
    // The policy this statement belongs to
    string policy_id = 5;
    // The SRN the statement applies to
    string srn = 10;
    // When the statement was created, in Unix epoch seconds
    int64 created_at = 15;
    // Whether the statement denies rather than allows
    bool deny = 20;
}

// A named bundle of statements
message Policy {
    // The policy id
    string id = 1;
    // The account that owns the policy
    string owner_id = 5;
    // When the policy was created, in Unix epoch seconds
    int64 created_at = 10;
    // The statements that make up the policy
    repeated Statement statements = 15;
}

// The account boundary policy after the update
message UpdateAccountBoundaryPolicyResponse {
    // The account's boundary policy
    Policy policy = 1;
}
