syntax = "proto3";

package ai.sigmafinancial.aima.v1.management.user.services;

import "dtp-aima-gw-protocols-shared/proto/v1/account.proto";
import "dtp-aima-gw-protocols-shared/proto/v1/auth.proto";

// The created account and its root key
message CreateAccountResponse {
    // The created account
    ai.sigmafinancial.aima.v1.user.Account created = 1;
    // The account's root key, including its secret
    ai.sigmafinancial.aima.v1.auth.AppKey root_key = 5;
}
